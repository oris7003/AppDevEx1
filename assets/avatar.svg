<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="avatar-circle">
      <circle cx="100" cy="100" r="92"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg-grad)"/>

  <!-- Clipped character elements -->
  <g clip-path="url(#avatar-circle)">
    <!-- Shoulders & Shirt -->
    <path d="M40 190 C40 145, 65 130, 100 130 C135 130, 160 145, 160 190 Z" fill="url(#shirt-grad)"/>
    <!-- Collar / Inner Shirt -->
    <polygon points="90,130 110,130 100,150" fill="#ffffff" opacity="0.9"/>
    <polygon points="93,130 107,130 100,144" fill="#e2e8f0"/>

    <!-- Neck -->
    <rect x="88" y="105" width="24" height="30" rx="6" fill="#fdba74"/>

    <!-- Head -->
    <ellipse cx="100" cy="85" rx="34" ry="40" fill="url(#skin-grad)"/>

    <!-- Hair (Back/Base) -->
    <path d="M66 80 C66 48, 80 40, 100 40 C120 40, 134 48, 134 80 C134 85, 132 95, 132 95 C125 78, 118 74, 100 74 C82 74, 75 78, 68 95 C68 95, 66 85, 66 80 Z" fill="url(#hair-grad)"/>
    
    <!-- Modern Hair Swoop -->
    <path d="M66 65 C72 45, 90 38, 115 40 C130 42, 136 50, 132 60 C122 48, 102 46, 85 53 C76 57, 70 61, 66 65 Z" fill="url(#hair-grad)"/>

    <!-- Ears -->
    <circle cx="65" cy="86" r="7" fill="#fdba74"/>
    <circle cx="135" cy="86" r="7" fill="#fdba74"/>

    <!-- Glasses / Eyewear (modern developer look) -->
    <g stroke="#1e293b" stroke-width="2.5" fill="none">
      <rect x="73" y="77" width="20" height="15" rx="4" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="107" y="77" width="20" height="15" rx="4" fill="#ffffff" fill-opacity="0.2"/>
      <line x1="93" y1="83" x2="107" y2="83"/>
      <line x1="66" y1="82" x2="73" y2="82"/>
      <line x1="127" y1="82" x2="134" y2="82"/>
    </g>

    <!-- Eyes inside glasses -->
    <circle cx="83" cy="84" r="2.5" fill="#0f172a"/>
    <circle cx="117" cy="84" r="2.5" fill="#0f172a"/>

    <!-- Smile -->
    <path d="M92 104 Q100 112 108 104" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#60a5fa" stroke-width="3" opacity="0.6"/>
</svg>
